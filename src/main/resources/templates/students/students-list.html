<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <title>Liste des étudiants</title>
</head>

<body>

<!-- ========== CONTENU ========== -->
<div layout:fragment="content">

    <!-- Topbar -->
    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <button class="menu-toggle"
                    onclick="document.getElementById('sidebar').classList.toggle('show')">
                <i class="bi bi-list"></i>
            </button>
            <div>
                <h1>Liste des étudiants</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="#" class="text-decoration-none">Accueil</a>
                        </li>
                        <li class="breadcrumb-item active">Étudiants</li>
                    </ol>
                </nav>
            </div>
        </div>

        <a th:href="@{/students/add}" class="btn btn-primary-custom">
            <i class="bi bi-plus-lg"></i> Ajouter un étudiant
        </a>
    </div>

    <!-- Messages flash -->
    <div th:if="${successMessage}" class="alert-custom alert-success-custom">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert-custom alert-danger-custom">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Table card -->
    <div class="content-card">

        <div class="content-card-header">
            <h5>
                <i class="bi bi-table me-2 text-primary"></i>
                Liste complète
            </h5>

            <form th:action="@{/students/filter}" method="get"
                  class="d-flex gap-2 align-items-center flex-wrap">

                <div class="content-card-header">

                    <div class="d-flex gap-2 align-items-center flex-wrap">

                        <!-- Filtre par classe -->
                        <form th:action="@{/students/filter}" method="get">
                            <div class="search-box">
                                <i class="bi bi-building"></i>
                                <select name="classeId"
                                        class="form-select"
                                        style="padding-left: 38px; height: 40px; border-radius: 8px; min-width: 200px;"
                                        onchange="this.form.submit()">
                                    <option value="">Toutes les classes</option>
                                    <option th:each="c : ${classes}"
                                            th:value="${c.id}"
                                            th:text="${c.nom}"
                                            th:selected="${selectedClasseId != null and selectedClasseId == c.id}">
                                        Classe
                                    </option>
                                </select>
                            </div>
                        </form>

                        <!-- Recherche par nom -->
                        <form th:action="@{/students/search}" method="get" class="search-box">
                            <i class="bi bi-search"></i>
                            <input type="text"
                                   name="keyword"
                                   placeholder="Rechercher par nom..."
                                   th:value="${keyword}">
                        </form>

                    </div>
                </div>

                <!-- Bouton reset -->
                <a th:if="${selectedClasseId != null}"
                   th:href="@{/students}"
                   class="btn btn-outline-secondary"
                   style="border-radius: 8px; height: 40px; display: inline-flex; align-items: center;">
                    <i class="bi bi-x-lg me-1"></i> Réinitialiser
                </a>

            </form>
        </div>

        <div class="table-responsive">
            <table class="table table-custom align-middle">
                <thead>
                <tr>
                    <th>Étudiant</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>Moyenne</th>
                    <th>Classe</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="student : ${students}">

                    <td>
                        <div class="student-name">
                            <div class="avatar"
                                 th:text="${#strings.substring(student.nom, 0, 1) + #strings.substring(student.prenom, 0, 1)}">
                                AB
                            </div>
                            <div>
                                <div class="fw-semibold"
                                     th:text="${student.nom + ' ' + student.prenom}">
                                    Nom Prénom
                                </div>
                                <small class="text-muted" th:text="'#' + ${student.id}">#0</small>
                            </div>
                        </div>
                    </td>

                    <td>
                        <i class="bi bi-envelope me-1 text-muted"></i>
                        <span th:text="${student.email}">email@example.com</span>
                    </td>

                    <td>
                        <i class="bi bi-telephone me-1 text-muted"></i>
                        <span th:text="${student.telephone}">06 00 00 00 00</span>
                    </td>

                    <td>
                        <span class="badge-soft"
                              th:classappend="${student.average >= 14 ? 'badge-soft-success' :
                                                (student.average >= 10 ? 'badge-soft-primary' : 'badge-soft-danger')}"
                              th:text="${student.average}">
                            12
                        </span>
                    </td>

                    <td>
                        <span th:if="${student.classe != null}"
                              class="badge-soft badge-soft-primary"
                              th:text="${student.classe.nom}">
                            Classe
                        </span>

                        <span th:if="${student.classe == null}"
                              class="badge-soft badge-soft-gray">
                            Aucune classe
                        </span>
                    </td>

                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/students/{id}/details(id=${student.id})}"
                               class="action-btn view"
                               title="Détails">
                                <i class="bi bi-eye"></i>
                            </a>

                            <a th:href="@{/students/edit/{id}(id=${student.id})}"
                               class="action-btn edit"
                               title="Modifier">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <a th:href="@{/students/delete/{id}(id=${student.id})}"
                               class="action-btn delete"
                               title="Supprimer"
                               onclick="return confirm('Voulez-vous supprimer cet étudiant ?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>

                </tr>

                <tr th:if="${students == null or students.empty}">
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <h5 class="mb-1">Aucun étudiant trouvé</h5>
                            <p class="mb-0">Commencez par ajouter un nouvel étudiant.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
<!-- ========== FIN CONTENU ========== -->

<!-- ========== JS SPÉCIFIQUE (optionnel) ========== -->
<th:block layout:fragment="page-js">
    <script>
        document.addEventListener('click', function (e) {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.querySelector('.menu-toggle');
            if (window.innerWidth <= 992 &&
                !sidebar.contains(e.target) &&
                !toggle.contains(e.target)) {
                sidebar.classList.remove('show');
            }
        });
    </script>
</th:block>

</body>
</html>
