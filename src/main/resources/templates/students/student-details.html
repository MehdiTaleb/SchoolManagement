<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <title>Détails étudiant</title>
</head>

<body>

<div layout:fragment="content">

    <!-- Topbar -->
    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <button class="menu-toggle"
                    onclick="document.getElementById('sidebar').classList.toggle('show')">
                <i class="bi bi-list"></i>
            </button>
            <div>
                <h1>Détails de l'étudiant</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a th:href="@{/}" class="text-decoration-none">Accueil</a>
                        </li>
                        <li class="breadcrumb-item">
                            <a th:href="@{/students}" class="text-decoration-none">Étudiants</a>
                        </li>
                        <li class="breadcrumb-item active">Détails</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="d-flex gap-2">
            <a th:href="@{/students}" class="btn btn-outline-secondary"
               style="border-radius: 8px; padding: 8px 16px;">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
            <a th:href="@{/students/edit/{id}(id=${student.id})}"
               class="btn btn-primary-custom">
                <i class="bi bi-pencil"></i> Modifier
            </a>
        </div>
    </div>

    <!-- Profile card -->
    <div class="content-card" style="max-width: 800px;">

        <div class="content-card-header">
            <h5>
                <i class="bi bi-person-vcard me-2 text-primary"></i>
                Informations personnelles
            </h5>
        </div>

        <div class="p-4">

            <!-- En-tête profil -->
            <div class="d-flex align-items-center mb-4 pb-4 border-bottom">
                <div class="avatar"
                     style="width: 72px; height: 72px; font-size: 1.5rem;"
                     th:text="${#strings.substring(student.nom, 0, 1) + #strings.substring(student.prenom, 0, 1)}">
                    AB
                </div>
                <div class="ms-3">
                    <h3 class="mb-1"
                        th:text="${student.nom + ' ' + student.prenom}">
                        Nom Prénom
                    </h3>
                    <span class="badge-soft badge-soft-gray"
                          th:text="'#' + ${student.id}">
                        #0
                    </span>
                </div>
            </div>

            <!-- Champs -->
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">Email</label>
                    <p class="mb-0 fw-semibold">
                        <i class="bi bi-envelope me-1 text-muted"></i>
                        <span th:text="${student.email} ?: 'Non renseigné'">email</span>
                    </p>
                </div>

                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">Téléphone</label>
                    <p class="mb-0 fw-semibold">
                        <i class="bi bi-telephone me-1 text-muted"></i>
                        <span th:text="${student.telephone} ?: 'Non renseigné'">téléphone</span>
                    </p>
                </div>

                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">Moyenne</label>
                    <p class="mb-0">
                        <span class="badge-soft"
                              th:classappend="${student.average != null ?
                                              (student.average >= 14 ? 'badge-soft-success' :
                                              (student.average >= 10 ? 'badge-soft-primary' : 'badge-soft-danger')) :
                                              'badge-soft-gray'}"
                              th:text="${student.average != null ? student.average : 'N/A'}">
                            15.5
                        </span>
                    </p>
                </div>

                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">Classe</label>
                    <p class="mb-0">
                        <span th:if="${student.classe != null}"
                              class="badge-soft badge-soft-primary"
                              th:text="${student.classe.nom}">
                            Classe
                        </span>
                        <span th:if="${student.classe == null}"
                              class="badge-soft badge-soft-gray">
                            Aucune classe
                        </span>
                    </p>
                </div>

            </div>

            <!-- Actions secondaires -->
            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <a th:href="@{/students/{id}/notes(id=${student.id})}"
                   class="btn btn-outline-primary"
                   style="border-radius: 8px;">
                    <i class="bi bi-clipboard-data"></i> Voir les notes
                </a>
            </div>
            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <a th:href="@{/students/edit/{id}(id=${student.id})}"
                   class="btn btn-primary-custom">
                    <i class="bi bi-pencil"></i> Modifier
                </a>

                <a th:href="@{/students/delete/{id}(id=${student.id})}"
                   class="btn btn-outline-danger"
                   style="border-radius: 8px;"
                   onclick="return confirm('Voulez-vous vraiment supprimer cet étudiant ?');">
                    <i class="bi bi-trash"></i> Supprimer
                </a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
