<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - School Manager">School Manager</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- CSS global du projet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- CSS spécifique à chaque page -->
    <th:block layout:fragment="page-css"></th:block>
</head>

<body>

<!-- ========== SIDEBAR ========== -->
<aside class="sidebar" id="sidebar">
    <a href="#" class="brand">
        <i class="bi bi-mortarboard-fill"></i>
        <span>School Manager</span>
    </a>

    <nav class="nav flex-column mt-3">
        <a class="nav-link" th:href="@{/}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a class="nav-link" th:href="@{/students}">
            <i class="bi bi-people-fill"></i> Étudiants
        </a>
        <a class="nav-link" th:href="@{/classes}">
            <i class="bi bi-building"></i> Classes
        </a>

        <a class="nav-link" th:href="@{/professeurs}">
            <i class="bi bi-person-badge-fill"></i> Professeurs
        </a>

        <a class="nav-link" th:href="@{/matieres}">
            <i class="bi bi-book-fill"></i> Matières
        </a>

        <!-- class="nav-link" th:href="@{/grades}">
            <i class="bi bi-clipboard-data"></i> Notes
        </a> -->
    </nav>
</aside>

<!-- ========== MAIN CONTENT ========== -->
<main class="main-content">
    <th:block layout:fragment="content"></th:block>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS spécifique à chaque page -->
<th:block layout:fragment="page-js"></th:block>

</body>
</html>
