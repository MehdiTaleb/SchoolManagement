<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <title>Détails de la classe</title>
</head>

<body>

<div layout:fragment="content">

    <!-- Topbar -->
    <div class="topbar">
        <div class="d-flex align-items-center gap-3">
            <button class="menu-toggle"
                    onclick="document.getElementById('sidebar').classList.toggle('show')">
                <i class="bi bi-list"></i>
            </button>
            <div>
                <h1>Détails de la classe</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a th:href="@{/}" class="text-decoration-none">Accueil</a>
                        </li>
                        <li class="breadcrumb-item">
                            <a th:href="@{/classes}" class="text-decoration-none">Classes</a>
                        </li>
                        <li class="breadcrumb-item active">Détails</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="d-flex gap-2">
            <a th:href="@{/classes}" class="btn btn-outline-secondary"
               style="border-radius: 8px; padding: 8px 16px;">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
            <a th:href="@{/classes/edit/{id}(id=${classe.id})}"
               class="btn btn-primary-custom">
                <i class="bi bi-pencil"></i> Modifier
            </a>
        </div>
    </div>

    <div class="content-card" style="max-width: 800px;">

        <div class="content-card-header">
            <h5>
                <i class="bi bi-building me-2 text-primary"></i>
                Informations
            </h5>
        </div>

        <div class="p-4">

            <!-- En-tête -->
            <div class="d-flex align-items-center mb-4 pb-4 border-bottom">
                <div class="avatar"
                     style="width: 72px; height: 72px; font-size: 1.5rem;
                            background: linear-gradient(135deg, #10b981, #059669);"
                     th:text="${#strings.substring(classe.nom, 0, 1)}">
                    A
                </div>
                <div class="ms-3">
                    <h3 class="mb-1" th:text="${classe.nom}">Nom</h3>
                    <span th:if="${classe.niveau != null}"
                          class="badge-soft badge-soft-primary"
                          th:text="${classe.niveau.label}">
                        Niveau
                    </span>
                </div>
            </div>

            <!-- Champs -->
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">ID</label>
                    <p class="mb-0 fw-semibold" th:text="'#' + ${classe.id}">#0</p>
                </div>

                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">Salle</label>
                    <p class="mb-0 fw-semibold">
                        <i class="bi bi-door-open me-1 text-muted"></i>
                        <span th:text="${classe.salle}">A101</span>
                    </p>
                </div>

                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">Nombre d'étudiants</label>
                    <p class="mb-0">
                        <span class="badge-soft badge-soft-success"
                              th:text="${classe.nombreEtudiants != null ? classe.nombreEtudiants : 0} + ' étudiants'">
                            0
                        </span>
                    </p>
                </div>

                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">Professeur</label>
                    <p class="mb-0">
                        <span th:if="${classe.professeur != null}"
                              class="fw-semibold"
                              th:text="${classe.professeur.nom + ' ' + classe.professeur.prenom}">
                            Nom
                        </span>
                        <span th:if="${classe.professeur == null}"
                              class="badge-soft badge-soft-gray">
                            Non assigné
                        </span>
                    </p>
                </div>

                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">Créée le</label>
                    <p class="mb-0" th:text="${classe.createdAt}">date</p>
                </div>

                <div class="col-md-6">
                    <label class="text-muted small fw-semibold text-uppercase">Modifiée le</label>
                    <p class="mb-0" th:text="${classe.updatedAt}">date</p>
                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
